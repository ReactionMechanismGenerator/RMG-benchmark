name: rmg_241_env
channels:
  - defaults
  - rmg
  - rdkit
  - cantera
  - anaconda
  - free
dependencies:
  - cairo <=1.14.12
  - rmg::cairocffi  <= 0.9.0
  - cantera >=2.3.0,<2.5
  - rmg::coolprop <=6.2.1
  - coverage <=4.5.3
  - cython >=0.25.2,<0.30
  - rmg::dde >=1, <2
  - ffmpeg <=4.0
  - rmg::gprof2dot
  - graphviz <=2.40.1
  - jinja2 <=2.10.1
  - jupyter <=1.0.0
  - rmg::lpsolve55 
  - markupsafe <=1.1.1
  - matplotlib >=1.5,<=3.1.0
  - mock <=3.0.5
  - mpmath <=1.1.0
  - networkx <=2.3
  - nose <=1.3.7
  - numpy >=1.10.0,<=1.16.4
  - rmg::openbabel <=2.4.1
  - psutil <=5.6.3
  - pydas >=1.0.1,<1.0.3
  - pydot ==1.2.2
  - free::pydot-ng
  - pydqed >=1.0.0,<=1.0.1
  - pygpu <=0.7.6
  - pymongo <=3.8.0
  - pyparsing <=2.4.0
  - rmg::pyrdl <=1.1.2
  - conda-forge::python >=2.7,<3  # more restrictive Python version needed
  - pyyaml <=5.1.1
  - rmg::quantities <=0.12.3
  - rdkit >=2018,<=2019.03.3.0
  - scikit-learn <=0.21.2
  - scipy <1.2.1
  - rmg::symmetry
  - rmg::textgenrnn
  - xlwt <=1.3.0
  # not originally part of the file, but if you don't include this then you will use your system libgfortran, which is almost certainly too modern
  - libgfortran >=3.0,<4
  - libgfortran-ng =7
  # - rmg::mopac  # this package has been deleted since 2.4.1 was out
  - decorator <=3.4.2 # newer versions don't forbid Python 2
  # - muq   # no longer installable, but not needed for general operation
